<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hand Tracking Flower Art</title>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    #canvas-container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="canvas-container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>
  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    let smoothX = 0, smoothY = 0, smoothBloom = 0.1;
    const lerpFactor = 0.12;

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawLotusPetal(ctx, x, y, length, width, angle, color, glowColor) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.shadowBlur = 15;
      ctx.shadowColor = glowColor;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(width, -length / 2, 0, -length);
      ctx.quadraticCurveTo(-width, -length / 2, 0, 0);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function drawSingleFlower(ctx, x, y, scale) {
      const petalLength = 45 * scale;
      const petalWidth = 16 * scale;

      const outerAngles = [-0.8, -0.4, 0, 0.4, 0.8];
      outerAngles.forEach(ang => {
        drawLotusPetal(ctx, x, y, petalLength * 1.1, petalWidth * 0.9, ang, 'rgba(236, 72, 153, 0.65)', '#f43f5e');
      });

      const innerAngles = [-0.5, -0.25, 0, 0.25, 0.5];
      innerAngles.forEach(ang => {
        drawLotusPetal(ctx, x, y, petalLength, petalWidth, ang, 'rgba(244, 114, 182, 0.9)', '#ec4899');
      });
    }

    function drawMultiFlowerBouquet(ctx, x, y, bloomFactor) {
      if (bloomFactor <= 0.05) return;

      const bottomY = canvasElement.height;

      // Glowing Blue Stem System
      ctx.save();
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#3b82f6';
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = 3;

      // Central Main Stem
      ctx.beginPath();
      ctx.moveTo(x, bottomY);
      ctx.quadraticCurveTo(x - 20, y + (bottomY - y) * 0.5, x, y);
      ctx.stroke();

      // Left Branch
      const leftX = x - 70 * bloomFactor;
      const leftY = y + 40;
      ctx.beginPath();
      ctx.moveTo(x - 10, y + (bottomY - y) * 0.3);
      ctx.quadraticCurveTo(x - 50, y + 100, leftX, leftY);
      ctx.stroke();

      // Right Branch
      const rightX = x + 75 * bloomFactor;
      const rightY = y + 60;
      ctx.beginPath();
      ctx.moveTo(x + 5, y + (bottomY - y) * 0.4);
      ctx.quadraticCurveTo(x + 50, y + 120, rightX, rightY);
      ctx.stroke();

      // Far Left Outer Branch
      const farLeftX = x - 130 * bloomFactor;
      const farLeftY = y + 90;
      ctx.beginPath();
      ctx.moveTo(x - 15, y + (bottomY - y) * 0.25);
      ctx.quadraticCurveTo(x - 90, y + 150, farLeftX, farLeftY);
      ctx.stroke();

      ctx.restore();

      // Draw Flowers at each branch endpoint
      drawSingleFlower(ctx, x, y, bloomFactor * 1.1);            // Main Center Flower
      drawSingleFlower(ctx, leftX, leftY, bloomFactor * 0.85);     // Left Flower
      drawSingleFlower(ctx, rightX, rightY, bloomFactor * 0.8);    // Right Flower
      drawSingleFlower(ctx, farLeftX, farLeftY, bloomFactor * 0.65); // Small Outer Flower
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const thumb = landmarks[4];
        const index = landmarks[8];

        const targetX = (1 - index.x) * canvasElement.width;
        const targetY = index.y * canvasElement.height;

        const rawDistance = Math.hypot(
          (thumb.x - index.x) * canvasElement.width,
          (thumb.y - index.y) * canvasElement.height
        );
        const targetBloom = Math.min(Math.max(rawDistance / 180, 0.05), 1.5);

        smoothX += (targetX - smoothX) * lerpFactor;
        smoothY += (targetY - smoothY) * lerpFactor;
        smoothBloom += (targetBloom - smoothBloom) * lerpFactor;

        drawMultiFlowerBouquet(canvasCtx, smoothX, smoothY, smoothBloom);

        // On-Screen Stats
        canvasCtx.save();
        canvasCtx.scale(-1, 1);
        canvasCtx.font = '16px monospace';
        canvasCtx.fillStyle = '#60a5fa';
        canvasCtx.shadowBlur = 8;
        canvasCtx.shadowColor = '#3b82f6';
        canvasCtx.fillText(`Bloom: ${smoothBloom.toFixed(2)}`, -smoothX + 20, smoothY);
        canvasCtx.restore();
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();
  </script>
</body>
</html>
