<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hand Tracking Flower Art</title>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    #canvas-container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="canvas-container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>
  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    let smoothX = 0, smoothY = 0, smoothBloom = 0.1;
    const lerpFactor = 0.12;

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawLotusPetal(ctx, x, y, length, width, angle, color, glowColor) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.shadowBlur = 15;
      ctx.shadowColor = glowColor;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(width, -length / 2, 0, -length);
      ctx.quadraticCurveTo(-width, -length / 2, 0, 0);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function drawSingleFlower(ctx, x, y, scale) {
      if (scale <= 0.05) return;
      const petalLength = 40 * scale;
      const petalWidth = 14 * scale;

      const outerAngles = [-0.8, -0.4, 0, 0.4, 0.8];
      outerAngles.forEach(ang => {
        drawLotusPetal(ctx, x, y, petalLength * 1.1, petalWidth * 0.9, ang, 'rgba(236, 72, 153, 0.65)', '#f43f5e');
      });

      const innerAngles = [-0.5, -0.25, 0, 0.25, 0.5];
      innerAngles.forEach(ang => {
        drawLotusPetal(ctx, x, y, petalLength, petalWidth, ang, 'rgba(244, 114, 182, 0.9)', '#ec4899');
      });
    }

    function drawBranchWithFlower(ctx, startX, startY, endX, endY, cpX, cpY, scale) {
      // Draw smooth curved branch connected to main stem
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(cpX, cpY, endX, endY);
      ctx.stroke();

      // Render flower at the branch tip
      drawSingleFlower(ctx, endX, endY, scale);
    }

    function drawMultiFlowerTree(ctx, x, y, bloomFactor) {
      if (bloomFactor <= 0.05) return;

      const bottomY = canvasElement.height;

      // 1. Draw Central Straight Stem
      ctx.save();
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#3b82f6';
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = 3.5;

      ctx.beginPath();
      ctx.moveTo(x, bottomY);
      ctx.lineTo(x, y); // Direct vertical line to fingertip
      ctx.stroke();

      // Stem height span for joint connections
      const stemLength = bottomY - y;

      // Define 5 Side Branch Configurations (directly attached to main stem at x)
      const branches = [
        // Left Branch 1 (Upper)
        { startY: y + stemLength * 0.2, endX: x - 110 * bloomFactor, endY: y + 50, cpX: x - 60, cpY: y + 10, scale: bloomFactor * 0.85 },
        // Right Branch 1 (Upper)
        { startY: y + stemLength * 0.28, endX: x + 120 * bloomFactor, endY: y + 30, cpX: x + 70, cpY: y - 10, scale: bloomFactor * 0.9 },
        // Left Branch 2 (Middle)
        { startY: y + stemLength * 0.45, endX: x - 160 * bloomFactor, endY: y + 130, cpX: x - 90, cpY: y + 80, scale: bloomFactor * 0.8 },
        // Right Branch 2 (Middle)
        { startY: y + stemLength * 0.55, endX: x + 170 * bloomFactor, endY: y + 180, cpX: x + 100, cpY: y + 120, scale: bloomFactor * 0.75 },
        // Lower Left Branch
        { startY: y + stemLength * 0.68, endX: x - 200 * bloomFactor, endY: y + 250, cpX: x - 120, cpY: y + 200, scale: bloomFactor * 0.7 }
      ];

      // Draw each side branch and flower
      branches.forEach(b => {
        drawBranchWithFlower(ctx, x, b.startY, b.endX, b.endY, b.cpX, b.cpY, b.scale);
      });

      ctx.restore();

      // 2. Draw Top Main Flower (Flower #6) at fingertip
      drawSingleFlower(ctx, x, y, bloomFactor * 1.15);
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const thumb = landmarks[4];
        const index = landmarks[8];

        const targetX = (1 - index.x) * canvasElement.width;
        const targetY = index.y * canvasElement.height;

        const rawDistance = Math.hypot(
          (thumb.x - index.x) * canvasElement.width,
          (thumb.y - index.y) * canvasElement.height
        );
        const targetBloom = Math.min(Math.max(rawDistance / 180, 0.05), 1.5);

        smoothX += (targetX - smoothX) * lerpFactor;
        smoothY += (targetY - smoothY) * lerpFactor;
        smoothBloom += (targetBloom - smoothBloom) * lerpFactor;

        drawMultiFlowerTree(canvasCtx, smoothX, smoothY, smoothBloom);

        // On-Screen Stats
        canvasCtx.save();
        canvasCtx.scale(-1, 1);
        canvasCtx.font = '16px monospace';
        canvasCtx.fillStyle = '#60a5fa';
        canvasCtx.shadowBlur = 8;
        canvasCtx.shadowColor = '#3b82f6';
        canvasCtx.fillText(`Bloom: ${smoothBloom.toFixed(2)}`, -smoothX + 20, smoothY);
        canvasCtx.restore();
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();
  </script>
</body>
</html>
